[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skycast"
version = "1.0.0"
description = "A beautiful weather CLI — current conditions and forecasts for any city, zero API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Dennis Koech", email = "denniskipkoech19@gmail.com" },
]
keywords = ["weather", "cli", "forecast", "open-meteo", "terminal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
skycast = "skycast.main:app"

[project.urls]
Homepage = "https://github.com/denniskoech1/skycast"
Repository = "https://github.com/denniskoech1/skycast"
"Bug Tracker" = "https://github.com/denniskoech1/skycast/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/skycast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
